name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install package
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e . pytest
      - name: Kernel import lint
        run: .venv/bin/python scripts/lint_kernel_imports.py
      - name: Test suite (digest goldens, gate golden replay, era exit codes,
              oracle triple over the bootstrap pack, materialization, schemas)
        run: .venv/bin/python -m pytest tests/ -q
      - name: Audit the bootstrap pack (re-executes admission vs committed records)
        run: .venv/bin/ratchet audit --pack tasks
