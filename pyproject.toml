[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harness-ratchet"
version = "0.1.0"
description = "CI for your harness: a mechanical ratchet that improves the config around a frozen local model"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "jsonschema>=4.20",
]

[project.scripts]
ratchet = "ratchet.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["ratchet"]

[tool.hatch.build.targets.wheel.force-include]
# The kit's standing overlays ship as package data so `ratchet init` can
# migrate them into a bank from an installed tool; dev checkouts fall back
# to reading mutations/ directly.
"mutations" = "ratchet/data/overlays"
